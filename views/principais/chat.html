<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farejo - Home</title>
    <link rel="shortcut icon" href="/imgs/logoFocinho.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/chatOng.css">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />


</head>
<body>
    
    <section class="containerChat">
        <img src="/imgs/logoCompleta.png" alt="" class="logo">
        
        <!-- Login -->
        <section class="login">
            <h2>Deseja continuar como </h2>
            <form class="loginForm">
                <div class="auxLogin">
                    <img src="/imgs/userA.png" alt="" class="imgUsuario" id="imgUsuario">
                    <input type="text" class="inputNome" id="inputNome" placeholder="Seu nome..." required />
                </div>
                
                <button type="submit" class="btnLogin">Entrar</button>
                <a href="/login">Realizar cadastro/login</a>
            </form>
        </section>


        <!-- Chat -->
        <div class="cont">
            <div class="ladoA">
                <h2 class="tituloA">Conversas</h2>

                <div class="pesquisa">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" id="inputPesquisa" placeholder="Buscar cliente...">
                </div>


                <ul id="clientes"></ul>

                <br><br>
                <button class="voltar">
                    <a href="/dashOng">Voltar</a>
                </button>
            </div>

            <section class="chat" id="ladoB">
                <section class="navbar">
                    <div class="grupoEsquerda">
                        <a href="/feed" class="voltar">
                            <span class="material-symbols-outlined">arrow_back</span>
                        </a>

                        <div class="infosSender">
                            <img src="" alt="" class="imgSender" id="imgSender">
                            <h2 class="nomeSender" id="nomeSender"></h2>
                        </div>
                    </div>

                    <!--<div class="acessibilidade">
                        <button class="aumentar">A+</button>
                        <button class="diminuir">A-</button>
                    </div>-->
                    
                </section>

                <secction class="mensagens">

                    <!--<div class="msgEnviadas">Hello, Wordl!</div>

                    <div class="msgRecebidas">
                        <span class="nomeEnviador">Manual do dev</span>
                        Olá, mundo!
                    </div>-->
                </secction>
                
                <form class="chatForm">
                    <input type="text" class="chatInput" placeholder="Digite uma mensagem..." required />
                    <button type="submit" class="btnChat">
                        <span class="material-symbols-outlined"> send </span>
                    </button>
                
                </form>
            </section>
        </div>
         

    </section>



    <script>
        fetch('/logarChat')
        .then(res => res.json())
        .then(data => {
            if (data.nome) {
            document.getElementById('inputNome').value = data.nome;
            document.getElementById('imgUsuario').src = `/${data.imagem}` || '/imgs/userA.png';
            }
        })
        .catch(err => console.error(err));
    </script>


     <!-- Funcões -->
    <script type="module" src="/js/funcoes/chat/chat.js"></script>
</body>
</html>
